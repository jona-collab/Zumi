<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zumi – Grow your study world</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/calendar.css">
<link rel="stylesheet" href="css/timer.css">
<link rel="stylesheet" href="css/world.css">
<link rel="stylesheet" href="css/charts.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/dreamy.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>

<aside class="side">
  <div class="brand">Zumi</div>
  <nav id="nav" aria-label="Main sections">
    <button data-view="dashboard"><b>Dashboard</b></button>
    <button data-view="subjects"><b>My Subjects</b></button>
    <button data-view="assignments"><b>Assignments</b></button>
    <button data-view="calendar"><b>Calendar</b></button>
    <button data-view="timer"><b>Study Timer</b></button>
    <button data-view="world"><b>My Study World</b></button>
    <button data-view="analytics"><b>Analytics</b></button>
    <button data-view="notes"><b>My Notes</b></button>
  </nav>
  <div class="side-foot">
    <div id="sideStats" class="chip"></div>
    <p class="note">Your data is saved in this browser only. Use Export data on the dashboard to back it up.</p>
    <button class="btn ghost small" data-act="reset">Reset session</button>
    <a class="btn ghost small" href="login.html" style="text-align:center;text-decoration:none">Log out</a>
  </div>
</aside>

<main id="view" tabindex="-1"></main>

<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<dialog id="confirm" aria-labelledby="cTitle">
  <h2 id="cTitle">Are you sure?</h2>
  <p id="cMsg"></p>
  <div class="row end"><button class="btn ghost" id="cNo">Cancel</button><button class="btn danger" id="cYes">Confirm</button></div>
</dialog>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="fx" aria-hidden="true"></div>
<script src="js/core/helpers.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/storage.js"></script>
<script src="js/core/auth.js"></script>
<script src="js/core/rewards.js"></script>
<script src="js/core/dialogs.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/features/dashboard.js"></script>
<script src="js/features/subjects.js"></script>
<script src="js/features/assignments.js"></script>
<script src="js/features/calendar.js"></script>
<script src="js/features/timer.js"></script>
<script src="js/features/world.js"></script>
<script src="js/features/analytics.js"></script>
<script src="js/features/notes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
